# ============================================================
# 本地构建配置（非机密，随仓库分发）
# ============================================================
# ⚠️ 请勿在本文件中填写任何凭证。凭证来源：
#   1) 用户级 ~/.gradle/gradle.properties（推荐）
#   2) 环境变量 OSSRH_USERNAME / OSSRH_PASSWORD /
#      SIGNING_KEY_ID / SIGNING_PASSWORD / SIGNING_SECRET_KEY_RING_FILE /
#      GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET
#   3) 本目录下不随仓库分发的 gradle.properties（.gitignore 已忽略）
# 模板见 gradle.properties.example
# ============================================================

# Android 配置（AGP 8.x 强制要求）
android.useAndroidX=true
android.enableJetifier=true

# Gradle 内存配置
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 指定 Gradle 使用的 Java 路径
# 需要 JDK 17。建议改用环境变量 JAVA_HOME，避免把本机绝对路径写进仓库。
# org.gradle.java.home=C\:\\Program Files\\zulu17.52.17-ca-jdk17.0.12-win_x64

# Android SDK 路径（如需可改用环境变量 ANDROID_HOME）
# sdk.dir=D:\\android
